name: Curadoria

# Robô de curadoria (#185, PRD #167): pesquisa e propõe revisões, nunca publica.
# Uma vez por semana, e à mão pelo `workflow_dispatch`. Rodada que falha (contexto
# ou registro) deixa o job vermelho e abre uma issue. O toque no banco
# também ajuda contra a hibernação do Supabase Free.

on:
  schedule:
    - cron: "0 5 * * 0" # domingo, 02:00 em Recife
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: curadoria
  cancel-in-progress: false

jobs:
  rodada:
    runs-on: ubuntu-latest
    # Pior caso: 18 chamadas Gemini de até 90 s, mais as pausas de 15 s.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rodar a curadoria
        run: pnpm curadoria
        env:
          CURADORIA_SUPABASE_URL: ${{ secrets.CURADORIA_SUPABASE_URL }}
          CURADORIA_SUPABASE_KEY: ${{ secrets.CURADORIA_SUPABASE_KEY }}
          CURADORIA_SEGREDO: ${{ secrets.CURADORIA_SEGREDO }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # O email do GitHub para run falho não é confiável (não chegou na #212):
      # abre uma issue, ou comenta na que já está aberta, sem duplicar por semana.
      - name: Avisar a falha por issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: "Curadoria: a rodada falhou"
          LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          corpo="A rodada do robô de curadoria falhou. Log: $LINK"
          aberta=$(gh issue list --state open --search "$TITULO in:title" --json number,title \
            --jq "map(select(.title == \"$TITULO\")) | .[0].number // empty")
          if [ -n "$aberta" ]; then
            gh issue comment "$aberta" --body "$corpo"
          else
            gh issue create --title "$TITULO" --body "$corpo"
          fi
